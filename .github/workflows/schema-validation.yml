name: Schema contract validation

on:
  pull_request:
    paths:
      - "schemas/**"
      - "scripts/validate_schemas.py"
      - "scripts/validate_sqlite_ddl.py"
      - "scripts/probe_android_termux.sh"
      - "scripts/validate_governance.py"
      - "docs/governance/**"
      - "docs/planning/README.md"
      - "docs/planning/PLANNING-COMPLETION-REGISTER.md"
      - "README.md"
      - ".github/workflows/schema-validation.yml"
  push:
    branches: [main, docs/complete-system-architecture]
    paths:
      - "schemas/**"
      - "scripts/validate_schemas.py"
      - "scripts/validate_sqlite_ddl.py"
      - "scripts/probe_android_termux.sh"
      - ".github/workflows/schema-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install pinned validator
        run: python -m pip install "jsonschema[format]==4.26.0"
      - name: Validate schemas and positive/negative fixtures
        run: python scripts/validate_schemas.py
      - name: Validate mandatory governance contract and entry points
        run: python scripts/validate_governance.py
      - name: Execute SQLite DDL and migration smoke tests
        run: python scripts/validate_sqlite_ddl.py
      - name: Validate Android probe shell syntax
        run: sh -n scripts/probe_android_termux.sh
