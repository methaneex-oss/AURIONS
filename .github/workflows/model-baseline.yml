name: AURIONS owned model baseline

on:
  push:
    branches: ["impl/**"]
    paths:
      - "ml/python/**"
      - "core/cpp/**"
      - "CMakeLists.txt"
      - ".github/workflows/model-baseline.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml/python/**"
      - "core/cpp/**"
      - "CMakeLists.txt"
      - ".github/workflows/model-baseline.yml"

permissions:
  contents: read

concurrency:
  group: model-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.2.6 pytest==9.0.2

      - name: Test configurable model provider runtime
        env:
          PYTHONPATH: ml/python
        run: python -m pytest -q ml/python/tests/test_provider_runtime.py

      - name: Verify model, causal masking, training, inference, and resumable checkpoint
        env:
          PYTHONPATH: ml/python
          AURIONS_CANDIDATE_CHECKPOINT: artifacts/aurions-admitted-candidate.pt
        run: python -m pytest -q ml/python/tests

      - name: Install SQLite development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build C++ cognition and inference adapter
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Exercise real C++ to admitted-candidate cognition preview
        env:
          PYTHONPATH: ml/python
          AURIONS_CANDIDATE_CHECKPOINT: artifacts/aurions-admitted-candidate.pt
        run: |
          python ml/python/tests/cpp_model_preview_e2e.py build/aurions "$AURIONS_CANDIDATE_CHECKPOINT"

      - name: Produce reproducible synthetic-only checkpoint
        env:
          PYTHONPATH: ml/python
        run: python -m aurions_ml.smoke_train --output artifacts/aurions-synthetic-baseline.pt --steps 60

      - name: Exercise local checkpoint inference
        env:
          PYTHONPATH: ml/python
        run: python -m aurions_ml.inference --checkpoint artifacts/aurions-synthetic-baseline.pt --prompt "AURIONS" --max-new-tokens 16

      - name: Publish quarantined smoke checkpoint
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aurions-quarantined-model-checkpoints
          path: |
            artifacts/aurions-synthetic-baseline.pt
            artifacts/aurions-admitted-candidate.pt
            artifacts/aurions-preview-benchmark.json
          if-no-files-found: error
          retention-days: 14
