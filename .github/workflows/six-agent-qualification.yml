name: Six-agent qualification

on:
  workflow_dispatch:
  push:
    branches:
      - test/six-agent-qualification-suite
      - feat/workforce-free-fallback
    paths:
      - .github/workflows/six-agent-qualification.yml
      - engineering/workforce/scripts/qualify_six_agents.py

permissions:
  contents: read

concurrency:
  group: aurions-six-agent-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify all six agent roles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: engineering/workforce/src
      GITHUB_WORKSPACE: ${{ github.workspace }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      QUALIFICATION_REPORT: agent-qualification-report.json
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate qualification script syntax
        run: python -m py_compile engineering/workforce/scripts/qualify_six_agents.py

      - name: Run six-agent qualification
        run: python engineering/workforce/scripts/qualify_six_agents.py

      - name: Preserve qualification report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: six-agent-qualification-report
          path: agent-qualification-report.json
          if-no-files-found: warn
          retention-days: 7
