name: AURIONS workforce — provider connectivity smoke test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Workforce branch containing the pinned model registry"
        required: true
        type: choice
        options:
          - feat/workforce-control-plane-hardening

permissions:
  contents: read

concurrency:
  group: aurions-workforce-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the workforce source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all six pinned model endpoints
        env:
          PYTHONPATH: engineering/workforce/src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          from workforce.model_registry import ROLE_MODEL_ASSIGNMENTS

          roles = [
              (role, profile["provider"], profile["model"], profile["api_url"])
              for role, profile in ROLE_MODEL_ASSIGNMENTS.items()
          ]

          groq_key = os.environ.get("GROQ_API_KEY", "")
          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          cf_account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          missing = [name for name, value in (
              ("GROQ_API_KEY", groq_key),
              ("CLOUDFLARE_API_TOKEN", cf_token),
              ("CLOUDFLARE_ACCOUNT_ID", cf_account),
          ) if not value]
          if missing:
              print("FAIL: missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          failures = []
          for role, provider, model, api_url in roles:
              if provider == "groq":
                  token = groq_key
                  url = api_url
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_completion_tokens": 12,
                      "temperature": 0,
                  }
              elif provider == "cloudflare":
                  token = cf_token
                  url = api_url.format(account_id=cf_account)
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_completion_tokens": 12,
                      "temperature": 0,
                  }
              else:
                  print(f"FAIL {role}: unsupported provider {provider!r}")
                  failures.append(role)
                  continue

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      choices = data.get("choices") or []
                      if response.status != 200 or not choices:
                          raise RuntimeError("response did not contain a chat completion")
                      returned_model = data.get("model", model)
                      print(f"PASS {role}: {provider} responded (model={returned_model})")
              except urllib.error.HTTPError as error:
                  # Emit bounded structured error fields only; never headers, tokens or raw bodies.
                  detail = ""
                  try:
                      body = json.loads(error.read(4096).decode("utf-8", errors="replace"))
                      candidate = body.get("error", body)
                      if isinstance(candidate, dict):
                          fields = {
                              key: candidate.get(key)
                              for key in ("message", "type", "code")
                              if isinstance(candidate.get(key), (str, int))
                          }
                          detail = " " + json.dumps(fields)[:360] if fields else ""
                  except Exception:
                      pass
                  print(f"FAIL {role}: HTTP {error.code}{detail}")
                  failures.append(role)
              except Exception as error:
                  print(f"FAIL {role}: {type(error).__name__}: {str(error)[:240]}")
                  failures.append(role)

          print(f"RESULT: {len(roles) - len(failures)}/{len(roles)} model endpoints passed.")
          if failures:
              print("FAILED ROLES: " + ", ".join(failures))
              sys.exit(1)
          PY
