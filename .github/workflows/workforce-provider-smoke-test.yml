name: AURIONS workforce — provider connectivity smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: "Explicitly authorize six provider inference smoke tests"
        required: true
        default: false
        type: boolean
      confirm_cloudflare_free_plan:
        description: "I verified this account is on Workers Free, not Workers Paid"
        required: true
        default: false
        type: boolean
      confirm_groq_free_plan:
        description: "I verified this Groq account is on Free tier, not Developer tier. Developer tier charges per token."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aurions-workforce-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce explicit inference authorization
        env:
          CONFIRM_RUN: ${{ inputs.confirm_run }}
          CONFIRM_CLOUDFLARE_FREE_PLAN: ${{ inputs.confirm_cloudflare_free_plan }}
          CONFIRM_GROQ_FREE_PLAN: ${{ inputs.confirm_groq_free_plan }}
        run: |
          if [ "$CONFIRM_RUN" != "true" ] || [ "$CONFIRM_CLOUDFLARE_FREE_PLAN" != "true" ] || [ "$CONFIRM_GROQ_FREE_PLAN" != "true" ]; then
            echo "Explicit inference authorization and confirmation of both provider Free tiers are required."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install workforce dependencies
        run: python -m pip install -r engineering/workforce/requirements.txt
      - name: Live preflight all six pinned model endpoints
        env:
          PYTHONPATH: engineering/workforce/src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m workforce.provider_preflight
