name: AURIONS workforce — provider connectivity smoke test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Workforce branch containing the pinned model registry"
        required: true
        type: choice
        options:
          - feat/workforce-control-plane-hardening

permissions:
  contents: read

concurrency:
  group: aurions-workforce-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the workforce source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all six pinned model endpoints
        env:
          PYTHONPATH: engineering/workforce/src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          from workforce.model_registry import ROLE_MODEL_ASSIGNMENTS

          roles = [
              (role, profile["provider"], profile["model"], profile["api_url"])
              for role, profile in ROLE_MODEL_ASSIGNMENTS.items()
          ]

          groq_key = os.environ.get("GROQ_API_KEY", "")
          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          cf_account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          missing = [name for name, value in (
              ("GROQ_API_KEY", groq_key),
              ("CLOUDFLARE_API_TOKEN", cf_token),
              ("CLOUDFLARE_ACCOUNT_ID", cf_account),
          ) if not value]
          if missing:
              print("FAIL: missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          def safe_error_detail(raw):
              """Extract provider error metadata without printing arbitrary response bodies."""
              try:
                  body = json.loads(raw.decode("utf-8", errors="replace"))
              except Exception:
                  return " provider returned a non-JSON error body"

              parts = []
              if isinstance(body, dict):
                  error = body.get("error")
                  if isinstance(error, dict):
                      fields = {
                          key: error[key]
                          for key in ("code", "type", "message")
                          if isinstance(error.get(key), (str, int))
                      }
                      if fields:
                          parts.append(fields)

                  errors = body.get("errors")
                  if isinstance(errors, list):
                      for item in errors[:2]:
                          if isinstance(item, dict):
                              fields = {
                                  key: item[key]
                                  for key in ("code", "message")
                                  if isinstance(item.get(key), (str, int))
                              }
                              if fields:
                                  parts.append(fields)

                  if not parts and isinstance(body.get("message"), str):
                      parts.append({"message": body["message"]})

              if not parts:
                  return " provider error body had no recognized message/code fields"
              return " " + json.dumps(parts, ensure_ascii=True)[:700]

          def probe_groq_auth_path(url, payload, label, authorization):
              """Compare unauthenticated controls with the real-key 403 without exposing secrets."""
              probe_headers = {
                  "Content-Type": "application/json",
                  "User-Agent": "AURIONS-Provider-Smoke-Test/1.0 (+https://github.com/methaneex-oss/AURIONS)",
              }
              if authorization is not None:
                  probe_headers["Authorization"] = authorization
              probe = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=probe_headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(probe, timeout=30) as response:
                      raw = response.read(1024)
                      status = response.status
                      content_type = response.headers.get("Content-Type", "unknown")
                      server = response.headers.get("Server", "unknown")
              except urllib.error.HTTPError as error:
                  raw = error.read(1024)
                  status = error.code
                  content_type = error.headers.get("Content-Type", "unknown")
                  server = error.headers.get("Server", "unknown")
              except Exception as error:
                  print(f"GROQ_DIAGNOSTIC {label}: {type(error).__name__}")
                  return
              body = " ".join(raw.decode("utf-8", errors="replace").split())[:240]
              print(
                  f"GROQ_DIAGNOSTIC {label}: HTTP {status}; "
                  f"content_type={content_type}; server={server}; body={body!r}"
              )

          failures = []
          groq_403_diagnostic_done = False
          for role, provider, model, api_url in roles:
              if provider == "groq":
                  token = groq_key
                  url = api_url
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_completion_tokens": 128,
                      "temperature": 0,
                  }
                  headers = {
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      # Cloudflare Error 1010 rejects Python urllib default User-Agent.
                      "User-Agent": "AURIONS-Provider-Smoke-Test/1.0 (+https://github.com/methaneex-oss/AURIONS)",
                  }
              elif provider == "cloudflare":
                  token = cf_token
                  url = api_url.format(account_id=cf_account)
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_tokens": 128,
                      "temperature": 0,
                  }
                  headers = {
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      # Required by Cloudflare for Workers AI (@cf/) model requests.
                      "cf-aig-gateway-id": "default",
                  }
              else:
                  print(f"FAIL {role}: unsupported provider {provider!r}")
                  failures.append(role)
                  continue

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      choices = data.get("choices") or []
                      if response.status != 200 or not choices:
                          raise RuntimeError("response did not contain a chat completion")
                      message = choices[0].get("message") or {}
                      content = message.get("content")
                      if not isinstance(content, str) or not content.strip():
                          finish_reason = choices[0].get("finish_reason", "unknown")
                          raise RuntimeError(
                              f"completion contained no visible text (finish_reason={finish_reason})"
                          )
                      returned_model = data.get("model", model)
                      print(f"PASS {role}: {provider} responded with visible text (model={returned_model})")
              except urllib.error.HTTPError as error:
                  raw = error.read(8192)
                  detail = safe_error_detail(raw)
                  request_id = (
                      error.headers.get("x-request-id")
                      or error.headers.get("cf-ray")
                  )
                  request_ref = f" request_id={request_id}" if request_id else ""
                  print(f"FAIL {role}: HTTP {error.code}{request_ref}{detail}")
                  if provider == "groq" and error.code == 403 and not groq_403_diagnostic_done:
                      groq_403_diagnostic_done = True
                      print("GROQ_DIAGNOSTIC: comparing no-auth and deliberately invalid-key controls")
                      probe_groq_auth_path(url, payload, "no_auth", None)
                      probe_groq_auth_path(url, payload, "fake_key", "Bearer deliberately-invalid-diagnostic-key")
                  failures.append(role)
              except Exception as error:
                  print(f"FAIL {role}: {type(error).__name__}: {str(error)[:240]}")
                  failures.append(role)

          print(f"RESULT: {len(roles) - len(failures)}/{len(roles)} model endpoints passed.")
          if failures:
              print("FAILED ROLES: " + ", ".join(failures))
              sys.exit(1)
          PY
