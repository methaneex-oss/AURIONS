name: AURIONS workforce — provider connectivity smoke test

on:
  push:
    branches:
      - feat/engineering-workforce-foundation
    paths:
      - .github/workflows/workforce-provider-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurions-workforce-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate all six pinned model endpoints
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          roles = [
              ("lead_builder", "groq", "openai/gpt-oss-120b"),
              ("specialist_builder", "cloudflare", "@cf/google/gemma-4-26b-a4b-it"),
              ("architecture_reviewer", "cloudflare", "@cf/zai-org/glm-4.7-flash"),
              ("code_reviewer", "groq", "qwen/qwen3.8-27b"),
              ("negative_tester", "groq", "openai/gpt-oss-20b"),
              ("integration_verifier", "cloudflare", "@cf/mistralai/mistral-small-3.1-24b-instruct"),
          ]

          groq_key = os.environ.get("GROQ_API_KEY", "")
          cf_token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          cf_account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          missing = [name for name, value in (
              ("GROQ_API_KEY", groq_key),
              ("CLOUDFLARE_API_TOKEN", cf_token),
              ("CLOUDFLARE_ACCOUNT_ID", cf_account),
          ) if not value]
          if missing:
              print("FAIL: missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          failures = []
          for role, provider, model in roles:
              if provider == "groq":
                  url = "https://api.groq.com/openai/v1/chat/completions"
                  token = groq_key
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_completion_tokens": 12,
                      "temperature": 0,
                  }
              else:
                  url = f"https://api.cloudflare.com/client/v4/accounts/{cf_account}/ai/v1/chat/completions"
                  token = cf_token
                  payload = {
                      "model": model,
                      "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                      "max_tokens": 12,
                      "temperature": 0,
                  }

              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      choices = data.get("choices") or []
                      if response.status != 200 or not choices:
                          raise RuntimeError("response did not contain a chat completion")
                      returned_model = data.get("model", model)
                      print(f"PASS {role}: {provider} responded (model={returned_model})")
              except urllib.error.HTTPError as error:
                  # Never print request headers, tokens, or full provider response bodies.
                  print(f"FAIL {role}: HTTP {error.code}")
                  failures.append(role)
              except Exception as error:
                  print(f"FAIL {role}: {type(error).__name__}: {str(error)[:240]}")
                  failures.append(role)

          print(f"RESULT: {len(roles) - len(failures)}/{len(roles)} model endpoints passed.")
          if failures:
              print("FAILED ROLES: " + ", ".join(failures))
              sys.exit(1)
          PY
