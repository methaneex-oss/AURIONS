name: C++ Core

on:
  push:
    branches: ["impl/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpp-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Configure, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev

      - name: Report toolchain
        run: |
          cmake --version
          c++ --version
          sqlite3 --version || true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
