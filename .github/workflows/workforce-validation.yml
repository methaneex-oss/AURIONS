name: Workforce control-plane validation

on:
  pull_request:
    paths:
      - "engineering/workforce/**"
      - ".github/workflows/workforce-validation.yml"
  push:
    branches:
      - "feat/engineering-workforce-foundation"
    paths:
      - "engineering/workforce/**"
      - ".github/workflows/workforce-validation.yml"

permissions:
  contents: read

jobs:
  workforce-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workforce dependencies
        run: python -m pip install -r engineering/workforce/requirements.txt
      - name: Compile workforce package
        run: python -m compileall -q engineering/workforce/src engineering/workforce/tests
      - name: Run deterministic domain tests
        env:
          PYTHONPATH: engineering/workforce/src
        run: python -m unittest discover -s engineering/workforce/tests -v
