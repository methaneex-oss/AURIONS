name: Manually approved six-role workforce run

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: "Explicitly authorize provider inference for this work package"
        required: true
        default: false
        type: boolean
      confirm_cloudflare_free_plan:
        description: "I verified this Cloudflare account is on Workers Free, not Workers Paid. Workers Paid can bill above 10,000 Neurons/day."
        required: true
        default: false
        type: boolean
      confirm_groq_free_plan:
        description: "I verified this Groq account is on Free tier, not Developer tier. Developer tier charges per token."
        required: true
        default: false
        type: boolean
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aurions-wf03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrated-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: workforce
          POSTGRES_USER: workforce
          POSTGRES_PASSWORD: workforce-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforce -d workforce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://workforce:workforce-ephemeral-password@localhost:5432/workforce
      PYTHONPATH: engineering/workforce/src
      WORKFORCE_CONTROL_PLANE_URL: http://127.0.0.1:8000
      MANIFEST_PATH: engineering/workforce/work-package.json
      WORKSPACE_DIR: ${{ github.workspace }}/../aurions-workspace
      WORKFORCE_MANIFEST_COPY: ${{ github.workspace }}/../work-package.json
      WORKFORCE_TEST_DOCKER_IMAGE: aurions-workforce-test-runner:ci
    steps:
      - name: Enforce Director authorization and target branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          CONFIRM_RUN: ${{ inputs.confirm_run }}
          CONFIRM_CLOUDFLARE_FREE_PLAN: ${{ inputs.confirm_cloudflare_free_plan }}
          CONFIRM_GROQ_FREE_PLAN: ${{ inputs.confirm_groq_free_plan }}
        run: |
          if [ "$REF_NAME" != "feat/workforce-control-plane-hardening" ]; then
            echo "Refusing to execute workforce providers outside the authorized feature branch."
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM_RUN" != "true" ]; then
            echo "Explicit workflow_dispatch confirmation is required."
            exit 1
          fi
          if [ "$CONFIRM_CLOUDFLARE_FREE_PLAN" != "true" ] || [ "$CONFIRM_GROQ_FREE_PLAN" != "true" ]; then
            echo "Refusing provider inference: Director must verify and explicitly confirm both Cloudflare Workers Free and Groq Free tiers."
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Only explicitly confirmed workflow_dispatch runs are supported."
            exit 1
          fi
      - name: Checkout selected branch
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering/workforce/requirements.txt
      - name: Install workforce dependencies
        run: python -m pip install -r engineering/workforce/requirements.txt
      - name: Apply workforce database migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          import os

          migration_dir = Path("engineering/workforce/migrations")
          migrations = sorted(migration_dir.glob("*.sql"))
          expected = [
              "001_initial.sql",
              "002_recovery_and_idempotency.sql",
              "003_immutable_evidence.sql",
              "004_agent_budget_ledger.sql",
              "005_absolute_task_deadlines.sql",
              "006_start_deadline_on_first_claim.sql",
          ]
          actual = [path.name for path in migrations]
          if actual != expected:
              raise SystemExit(f"unexpected workforce migration set/order: {actual!r}")
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              for path in migrations:
                  with conn.cursor() as cur:
                      cur.execute(path.read_text(encoding="utf-8"), prepare=False)
                  conn.commit()
                  print(f"Applied {path.name}")
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT to_regclass('public.wf_tasks') AS tasks,
                             to_regclass('public.wf_checkpoints') AS checkpoints,
                             to_regclass('public.wf_audit_events') AS audit,
                             to_regclass('public.wf_task_evidence') AS evidence,
                             to_regclass('public.wf_agent_budgets') AS budgets,
                             to_regclass('public.wf_budget_reservations') AS reservations,
                             to_regprocedure('public.wf_task_deadline(timestamp with time zone,jsonb)') AS deadline_fn,
                             to_regprocedure('public.wf_task_absolute_deadline(jsonb)') AS absolute_deadline_fn
                  """)
                  schema = cur.fetchone()
                  if any(value is None for value in schema):
                      raise SystemExit(f"workforce schema verification failed: {schema!r}")
                  print("Verified all required workforce tables and deadline functions.")
          PY
      - name: Prepare isolated candidate test runtime
        run: |
          docker pull postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          docker build --pull --file engineering/workforce/Dockerfile.test-runner --tag "$WORKFORCE_TEST_DOCKER_IMAGE" .
      - name: Generate ephemeral Director, orchestrator and six worker credentials
        run: |
          python - <<'PY'
          import json
          import os
          import secrets
          roles = (
              "lead_builder",
              "specialist_builder",
              "architecture_reviewer",
              "code_reviewer",
              "negative_tester",
              "integration_verifier",
          )
          director = secrets.token_urlsafe(32)
          orchestrator = secrets.token_urlsafe(32)
          workers = {
              f"run-worker-{role}": {"token": secrets.token_urlsafe(32), "role": role}
              for role in roles
          }
          print("::add-mask::" + director)
          print("::add-mask::" + orchestrator)
          print("::add-mask::" + json.dumps(workers))
          for worker in workers.values():
              print("::add-mask::" + worker["token"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("DIRECTOR_APPROVAL_TOKEN=" + director + "\n")
              env_file.write("WORKFORCE_ORCHESTRATOR_TOKEN=" + orchestrator + "\n")
              env_file.write("WORKFORCE_WORKER_CREDENTIALS_JSON=" + json.dumps(workers) + "\n")
          PY
      - name: Validate protected provider secrets and work-package manifest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from workforce.orchestrator import validate_manifest, _worker_tokens

          for key in (
              "DIRECTOR_APPROVAL_TOKEN",
              "WORKFORCE_ORCHESTRATOR_TOKEN",
              "WORKFORCE_WORKER_CREDENTIALS_JSON",
              "GROQ_API_KEY",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
          ):
              if not os.environ.get(key):
                  raise SystemExit(f"required environment value is missing: {key}")

          root = Path.cwd().resolve()
          manifest_path = (root / os.environ["MANIFEST_PATH"]).resolve()
          if root not in manifest_path.parents or not manifest_path.is_file():
              raise SystemExit("manifest_path must identify a committed file inside this checkout")
          manifest = validate_manifest(json.loads(manifest_path.read_text(encoding="utf-8")))
          base_sha = manifest["base_commit_sha"].lower()
          subprocess.run(["git", "cat-file", "-e", f"{base_sha}^{{commit}}"], check=True)
          parent_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip().lower()
          if parent_sha != base_sha:
              raise SystemExit("the manifest commit must be a direct child of the exact clean code baseline")
          manifest_rel = manifest_path.relative_to(root).as_posix()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, "HEAD"], text=True
          ).splitlines()
          if changed != [manifest_rel]:
              raise SystemExit("the manifest commit must change only the work-package manifest")
          _worker_tokens()
          workspace = Path(os.environ["WORKSPACE_DIR"])
          subprocess.run(["git", "worktree", "add", "--detach", str(workspace), base_sha], check=True)
          manifest_copy = Path(os.environ["WORKFORCE_MANIFEST_COPY"])
          manifest_copy.write_bytes(manifest_path.read_bytes())
          print("Manifest, exact clean base commit, isolated worktree and six role credentials validated.")
          PY
      - name: Start authenticated local control plane
        run: |
          python -m uvicorn workforce.api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/workforce-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workforce-api.pid"
          python - <<'PY'
          import time
          import httpx
          for _ in range(60):
              try:
                  response = httpx.get("http://127.0.0.1:8000/health", timeout=2)
                  if response.status_code == 200:
                      print("Control plane is healthy.")
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("control plane did not become healthy; inspect runner-local API logs")
          PY
      - name: Start durable lease and deadline supervisor
        run: |
          WORKFORCE_SUPERVISOR_INTERVAL_SECONDS=5 python -m workforce.supervisor > "$RUNNER_TEMP/workforce-supervisor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workforce-supervisor.pid"
      - name: Execute six roles and prepare Director packet
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m workforce.orchestrator --manifest "$WORKFORCE_MANIFEST_COPY" --workspace "$WORKSPACE_DIR"
      - name: Capture candidate patch and reports without committing
        if: always()
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          workspace = Path(os.environ["WORKSPACE_DIR"]).resolve()
          patch_path = checkout / "candidate.patch"
          artifact_dir = checkout / "wf03-artifacts"
          if artifact_dir.exists():
              shutil.rmtree(artifact_dir)
          if workspace.is_dir():
              untracked = subprocess.check_output(
                  ["git", "-C", str(workspace), "ls-files", "--others", "--exclude-standard", "-z"]
              ).decode().split(chr(0))
              untracked = [path for path in untracked if path and ".workforce-artifacts" not in path.split("/")]
              if untracked:
                  subprocess.run(["git", "-C", str(workspace), "add", "-N", "--", *untracked], check=True)
              with patch_path.open("wb") as output:
                  subprocess.run(["git", "-C", str(workspace), "diff", "--binary", "HEAD"], stdout=output, check=True)
              source_artifacts = workspace / "engineering/workforce/.workforce-artifacts"
              if source_artifacts.is_dir():
                  shutil.copytree(source_artifacts, artifact_dir, dirs_exist_ok=True)
          else:
              patch_path.write_bytes(b"")

          # Preserve bounded runtime diagnostics with the candidate and evidence.
          runtime_dir = artifact_dir / "runtime"
          runtime_dir.mkdir(parents=True, exist_ok=True)
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          for log_name in ("workforce-api.log", "workforce-supervisor.log"):
              source = runner_temp / log_name
              if source.is_file():
                  (runtime_dir / log_name).write_bytes(source.read_bytes()[-1_000_000:])

          print(f"Candidate patch captured at {patch_path}")
          print(f"Evidence artifact directory exists: {artifact_dir.is_dir()}")
          print(f"Runtime diagnostics captured: {runtime_dir.is_dir()}")
          PY
      - name: Upload candidate, reports and Director packet
        if: always()
        # actions/upload-artifact v4.6.1
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: aurions-workforce-${{ github.run_id }}
          path: |
            candidate.patch
            wf03-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local control plane and supervisor
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/workforce-api.pid" "$RUNNER_TEMP/workforce-supervisor.pid"; do
            if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          done
          if [ -n "${WORKSPACE_DIR:-}" ] && [ -d "$WORKSPACE_DIR" ]; then
            git worktree remove --force "$WORKSPACE_DIR" || true
          fi
