name: Manually approved six-role workforce run

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Committed Director-approved work-package JSON manifest"
        required: true
        type: string
      confirm_run:
        description: "Explicitly authorize provider inference for this work package"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aurions-workforce-${{ github.ref }}-${{ inputs.manifest_path }}
  cancel-in-progress: false

jobs:
  orchestrated-run:
    if: ${{ inputs.confirm_run == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workforce
          POSTGRES_USER: workforce
          POSTGRES_PASSWORD: workforce-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workforce -d workforce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://workforce:workforce-ephemeral-password@localhost:5432/workforce
      PYTHONPATH: engineering/workforce/src
      WORKFORCE_CONTROL_PLANE_URL: http://127.0.0.1:8000
      MANIFEST_PATH: ${{ inputs.manifest_path }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering/workforce/requirements.txt
      - name: Install workforce dependencies
        run: python -m pip install -r engineering/workforce/requirements.txt
      - name: Generate ephemeral Director, orchestrator and six worker credentials
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import secrets
          roles = (
              "lead_builder",
              "specialist_builder",
              "architecture_reviewer",
              "code_reviewer",
              "negative_tester",
              "integration_verifier",
          )
          director = secrets.token_urlsafe(32)
          orchestrator = secrets.token_urlsafe(32)
          workers = {
              f"run-worker-{role}": {"token": secrets.token_urlsafe(32), "role": role}
              for role in roles
          }
          print("DIRECTOR_APPROVAL_TOKEN=" + director)
          print("WORKFORCE_ORCHESTRATOR_TOKEN=" + orchestrator)
          print("WORKFORCE_WORKER_CREDENTIALS_JSON=" + json.dumps(workers))
          PY
      - name: Validate protected provider secrets and work-package manifest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from workforce.orchestrator import validate_manifest, _worker_tokens

          for key in (
              "DIRECTOR_APPROVAL_TOKEN",
              "WORKFORCE_ORCHESTRATOR_TOKEN",
              "WORKFORCE_WORKER_CREDENTIALS_JSON",
              "GROQ_API_KEY",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID",
          ):
              if not os.environ.get(key):
                  raise SystemExit(f"required environment value is missing: {key}")

          root = Path.cwd().resolve()
          manifest_path = (root / os.environ["MANIFEST_PATH"]).resolve()
          if root not in manifest_path.parents or not manifest_path.is_file():
              raise SystemExit("manifest_path must identify a committed file inside this checkout")
          manifest = validate_manifest(json.loads(manifest_path.read_text(encoding="utf-8")))
          base_sha = manifest["base_commit_sha"]
          subprocess.run(["git", "cat-file", "-e", f"{base_sha}^{{commit}}"], check=True)
          manifest_rel = manifest_path.relative_to(root).as_posix()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, "HEAD"], text=True
          ).splitlines()
          if changed != [manifest_rel]:
              raise SystemExit("the work-package commit must change only the manifest; base SHA must identify the exact clean code baseline")
          _worker_tokens()
          workspace = Path(os.environ["RUNNER_TEMP"]) / "aurions-workspace"
          subprocess.run(["git", "worktree", "add", "--detach", str(workspace), base_sha], check=True)
          manifest_copy = Path(os.environ["RUNNER_TEMP"]) / "work-package.json"
          manifest_copy.write_bytes(manifest_path.read_bytes())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"WORKSPACE_DIR={workspace}\\n")
              env_file.write(f"WORKFORCE_MANIFEST_COPY={manifest_copy}\\n")
          print("Manifest, exact clean base commit, isolated worktree and six role credentials validated.")
          PY
      - name: Generate isolated PostgreSQL integration-test credentials
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import secrets
          director = secrets.token_urlsafe(32)
          orchestrator = secrets.token_urlsafe(32)
          builder = secrets.token_urlsafe(32)
          reviewer = secrets.token_urlsafe(32)
          print("WORKFORCE_TEST_DIRECTOR_TOKEN=" + director)
          print("WORKFORCE_TEST_ORCHESTRATOR_TOKEN=" + orchestrator)
          print("WORKFORCE_TEST_WORKER_CREDENTIALS_JSON=" + json.dumps({
              "builder-01": {"token": builder, "role": "lead_builder"},
              "reviewer-01": {"token": reviewer, "role": "code_reviewer"},
          }))
          print("WORKFORCE_TEST_DATABASE_URL=postgresql://workforce:workforce-ephemeral-password@localhost:5432/workforce_test")
          PY
      - name: Create separate test database and apply all migrations
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE workforce_test")

          migrations = sorted(Path("engineering/workforce/migrations").glob("*.sql"))
          for database_url in (os.environ["DATABASE_URL"], os.environ["WORKFORCE_TEST_DATABASE_URL"]):
              with psycopg.connect(database_url) as conn:
                  for migration in migrations:
                      conn.execute(migration.read_text(encoding="utf-8"))
          print(f"Applied {len(migrations)} migrations to separate control-plane and test databases.")
          PY
      - name: Start authenticated local control plane
        run: |
          python -m uvicorn workforce.api:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/workforce-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workforce-api.pid"
          python - <<'PY'
          import time
          import httpx
          for _ in range(60):
              try:
                  response = httpx.get("http://127.0.0.1:8000/health", timeout=2)
                  if response.status_code == 200:
                      print("Control plane is healthy.")
                      break
              except httpx.HTTPError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("control plane did not become healthy; inspect runner-local API logs")
          PY
      - name: Start durable lease and deadline supervisor
        run: |
          WORKFORCE_SUPERVISOR_INTERVAL_SECONDS=5 python -m workforce.supervisor > "$RUNNER_TEMP/workforce-supervisor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/workforce-supervisor.pid"
      - name: Execute six roles and prepare Director packet
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m workforce.orchestrator --manifest "$WORKFORCE_MANIFEST_COPY" --workspace "$WORKSPACE_DIR"
      - name: Capture candidate patch without committing
        if: always()
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          os.chdir(os.environ["WORKSPACE_DIR"])
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          ).decode().split("\\0")
          untracked = [path for path in untracked if path and ".workforce-artifacts" not in path.split("/")]
          if untracked:
              subprocess.run(["git", "add", "-N", "--", *untracked], check=True)
          with Path("candidate.patch").open("wb") as output:
              subprocess.run(["git", "diff", "--binary", "HEAD"], stdout=output, check=True)
          PY
      - name: Upload candidate, reports and Director packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurions-workforce-${{ github.run_id }}
          path: |
            ${{ env.WORKSPACE_DIR }}/candidate.patch
            ${{ env.WORKSPACE_DIR }}/engineering/workforce/.workforce-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local control plane and supervisor
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/workforce-api.pid" "$RUNNER_TEMP/workforce-supervisor.pid"; do
            if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          done
          if [ -n "${WORKSPACE_DIR:-}" ] && [ -d "$WORKSPACE_DIR" ]; then
            git worktree remove --force "$WORKSPACE_DIR" || true
          fi
